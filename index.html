<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaxEase Admin Dashboard | Canada Tax Filing Management</title>
    <meta name="description" content="Professional admin dashboard for CA firms to manage Canadian personal tax filing (T1), clients, documents, payments, and workflow efficiently." />
    <meta name="author" content="TaxEase" />
    <meta name="keywords" content="tax filing, T1, Canada taxes, CA firm, admin dashboard, client management" />

    <meta property="og:title" content="TaxEase Admin Dashboard" />
    <meta property="og:description" content="Professional admin dashboard for managing Canadian personal tax filing" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@TaxEase" />
    
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <link rel="canonical" href="/" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<div style="padding:40px;font-family:system-ui"><h2 style="color:#dc2626">Loading Error</h2><p>' + (e.message || 'Unknown error') + '</p><p style="color:#666;font-size:12px">' + (e.filename || '') + '</p><button onclick="location.reload(true)" style="padding:8px 16px;background:#2563eb;color:white;border:none;border-radius:4px;cursor:pointer;margin-top:10px">Reload</button></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
